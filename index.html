<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sweeping Incremental - Dust Cleaner</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Main WebGL & Interaction Canvases -->
  <div id="game-container">
    <canvas id="glcanvas"></canvas>
    <canvas id="overlay-canvas"></canvas>
  </div>

  <!-- Top Right Dust Cleared Indicator & Sound Toggle -->
  <header class="hud-top-right">
    <div class="hud-card indicator-card">
      <span class="stat-icon">🧹</span>
      <span id="dust-indicator" class="stat-text">Dust Cleared: 0.0g [0.0%]</span>
    </div>
    <button id="sound-btn" class="icon-btn" title="Toggle Sound (M)" aria-label="Toggle Sound">
      <span id="sound-icon">🔊</span>
    </button>
  </header>

  <!-- Bottom Left Robot Storage Progress Bar (like stored dust) -->
  <aside class="robot-storage-sidebar">
    <div id="robot-storage-card" class="storage-card">
      <div class="storage-title">ROBOT</div>
      
      <div class="storage-bar-outer">
        <div class="storage-bar-track">
          <div id="robot-storage-fill" class="storage-fill"></div>
        </div>
      </div>

      <div class="storage-footer">
        <span id="robot-storage-value" class="storage-text">0.00 / 0.50g</span>
      </div>
    </div>
  </aside>

  <!-- Right Vertical Storage Progress Bar (Stored Dust) -->
  <aside class="storage-sidebar">
    <div class="storage-card">
      <div class="storage-title">STORAGE</div>
      
      <div class="storage-bar-outer">
        <div class="storage-bar-track">
          <div id="storage-fill" class="storage-fill"></div>
        </div>
      </div>

      <div class="storage-footer">
        <span id="storage-value" class="storage-text">0.0 / 10g</span>
      </div>
    </div>
  </aside>

  <!-- Bottom Menu Dock: brown squares with light brown outlines and grey circle icon -->
  <nav class="bottom-menu-dock">
    <button id="shop-btn" class="menu-square-btn" title="Open Dust Shop (B)">
      <div class="grey-circle-icon"></div>
      <span class="menu-btn-label">SHOP</span>
    </button>
  </nav>

  <!-- Shop Modal: Brown square card with light brown outlines & white title -->
  <div id="shop-modal" class="shop-modal hidden">
    <div class="shop-card">
      <div class="shop-header">
        <div class="shop-header-title-row">
          <div class="grey-circle-icon small"></div>
          <h2 class="shop-title">DUST SHOP</h2>
        </div>
        <button id="shop-close-btn" class="shop-close-btn" aria-label="Close Shop">&times;</button>
      </div>

      <div class="shop-items">
        <!-- Upgrade 1: Speed -->
        <div class="shop-item">
          <div class="item-info">
            <div class="item-title-row">
              <span class="item-name">Speed</span>
              <span id="speed-level" class="item-level">Lvl 0</span>
            </div>
            <p class="item-desc">+0.1% screen/s speed</p>
            <div class="item-stat-row">
              <span class="stat-current">Current: <strong id="speed-current">1.0% / s</strong></span>
            </div>
          </div>
          <button id="buy-speed-btn" class="buy-btn" title="Buy Speed Upgrade">
            <span class="buy-label">Buy</span>
            <span id="speed-cost" class="buy-cost">0.50g</span>
          </button>
        </div>

        <!-- Upgrade 2: Capacity Mult -->
        <div class="shop-item">
          <div class="item-info">
            <div class="item-title-row">
              <span class="item-name">Capacity Mult</span>
              <span id="capacity-level" class="item-level">Lvl 0</span>
            </div>
            <p class="item-desc">+0.1x vacuum space</p>
            <div class="item-stat-row">
              <span class="stat-current">Current: <strong id="capacity-current">0.50g (1.0x)</strong></span>
            </div>
          </div>
          <button id="buy-capacity-btn" class="buy-btn" title="Buy Capacity Upgrade">
            <span class="buy-label">Buy</span>
            <span id="capacity-cost" class="buy-cost">0.50g</span>
          </button>
        </div>
      </div>

      <div class="shop-footer">
        <span class="shop-wallet">Stored Dust: <strong id="shop-stored-dust">0.0g</strong></span>
      </div>
    </div>
  </div>

  <!-- Instruction Hint -->
  <div id="hint-overlay" class="hint-overlay">
    <div class="hint-content">
      <div class="mouse-icon">🖱️</div>
      <span>Hold <strong>Left Click</strong> to vacuum towards your cursor!</span>
    </div>
  </div>

  <!-- Milestone Celebration Toast -->
  <div id="toast" class="toast hidden">
    <span id="toast-text">✨ 25% Cleaned! Great job!</span>
  </div>

  <script src="values.js"></script>
  <script src="sound.js"></script>
  <script src="game.js"></script>
</body>
</html>
