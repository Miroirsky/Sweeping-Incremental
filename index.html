<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sweeping Incremental - Dust Cleaner</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Main WebGL & Interaction Canvases -->
  <div id="game-container">
    <canvas id="glcanvas"></canvas>
    <canvas id="overlay-canvas"></canvas>
  </div>

  <!-- Top Right Dust & Dirt Indicators & Sound Toggle -->
  <header class="hud-top-right">
    <div class="hud-card indicator-card">
      <img src="Assets/Icons/Dust.png" alt="Dust" class="hud-stat-icon" draggable="false">
      <span id="dust-indicator" class="stat-text">Dust Cleared: 0.0g [0.0%]</span>
      <div class="dirt-badge" id="dirt-badge" title="Dirt on Screen (Capped at 100g)">
        <img src="Assets/Icons/Dirt.png" alt="Dirt" class="hud-stat-icon" draggable="false">
        <span id="dirt-indicator" class="dirt-text">Dirt: 0.0 / 100g</span>
      </div>
    </div>
    <button id="sound-btn" class="icon-btn" title="Toggle Sound (M)" aria-label="Toggle Sound">
      <span id="sound-icon">🔊</span>
    </button>
  </header>

  <!-- Bottom Left Robot Storage Progress Bar (Grey for Dust, Brown for Dirt) -->
  <aside class="robot-storage-sidebar">
    <div id="robot-storage-card" class="storage-card">
      <div class="storage-title">B.O.B.</div>
      
      <div class="storage-bar-outer">
        <div class="storage-bar-track">
          <div id="robot-storage-fill-dust" class="storage-fill robot-fill-dust"></div>
          <div id="robot-storage-fill-dirt" class="storage-fill robot-fill-dirt"></div>
        </div>
      </div>

      <div class="storage-footer">
        <span id="robot-storage-value" class="storage-text">0.00 / 0.50g</span>
        <div class="storage-breakdown">
          <span class="mini-tag dust-tag"><img src="Assets/Icons/Dust.png" alt="Dust" class="inventory-icon" draggable="false"><span id="robot-dust-text">0.00g</span></span>
          <span class="mini-tag dirt-tag"><img src="Assets/Icons/Dirt.png" alt="Dirt" class="inventory-icon" draggable="false"><span id="robot-dirt-text">0.00g</span></span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Center Right Separate Storage Indicators: Dust & Dirt -->
  <aside class="storage-center-right" id="storage-indicator-container">
    <!-- Dust Storage Card -->
    <div class="storage-card-indicator dust-storage-card" id="storage-dust-card" title="Stored Dust (Infinite)">
      <div class="storage-indicator-label"><img src="Assets/Icons/Dust.png" alt="Dust" class="storage-header-icon" draggable="false">DUST</div>
      <div class="storage-indicator-val-row">
        <span id="storage-dust-value" class="storage-value-text">0.0g</span>
      </div>
    </div>

    <!-- Dirt Storage Card -->
    <div class="storage-card-indicator dirt-storage-card" id="storage-dirt-card" title="Stored Dirt (Infinite)">
      <div class="storage-indicator-label"><img src="Assets/Icons/Dirt.png" alt="Dirt" class="storage-header-icon" draggable="false">DIRT</div>
      <div class="storage-indicator-val-row">
        <span id="storage-dirt-value" class="storage-value-text">0.0g</span>
      </div>
    </div>
  </aside>

  <!-- Bottom Menu Dock: brown squares with light brown outlines and dust/dirt icons for shops -->
  <nav class="bottom-menu-dock" id="bottom-menu-dock">
    <button id="dust-shop-btn" class="menu-square-btn" title="Dust Shop (E)" aria-label="Dust Shop">
      <img src="Assets/Icons/Dust.png" alt="Dust Shop" class="menu-btn-icon" draggable="false">
      <span class="menu-btn-label">DUST</span>
    </button>
    <button id="dirt-shop-btn" class="menu-square-btn hidden" style="display: none;" title="Dirt Shop" aria-label="Dirt Shop">
      <img src="Assets/Icons/Dirt.png" alt="Dirt Shop" class="menu-btn-icon" draggable="false">
      <span class="menu-btn-label">DIRT</span>
    </button>
  </nav>

  <!-- Upgrades Card System Tray (appears at bottom of screen when shop is opened) -->
  <div id="shop-cards-tray" class="shop-cards-tray hidden" role="region" aria-label="Shop Upgrades"></div>

  <!-- Instruction Hint -->
  <div id="hint-overlay" class="hint-overlay">
    <div class="hint-content">
      <div class="mouse-icon">🖱️</div>
      <span>Hold <strong>Left Click</strong> to vacuum, <strong>Right Click</strong> or <strong>Space</strong> to store!</span>
    </div>
  </div>

  <!-- Milestone Celebration Toast -->
  <div id="toast" class="toast hidden">
    <span id="toast-text">✨ 25% Cleaned! Great job!</span>
  </div>

  <script src="values.js"></script>
  <script src="sound.js"></script>
  <script src="game.js"></script>
</body>
</html>
