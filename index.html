<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sweeping Incremental - Dust Cleaner</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Main WebGL & Interaction Canvases -->
  <div id="game-container">
    <canvas id="glcanvas"></canvas>
    <canvas id="overlay-canvas"></canvas>
  </div>

  <!-- Top Right Dust & Dirt Indicators & Sound Toggle -->
  <header class="hud-top-right">
    <div class="hud-card indicator-card">
      <span class="stat-icon">🧹</span>
      <span id="dust-indicator" class="stat-text">Dust Cleared: 0.0g [0.0%]</span>
      <div class="dirt-badge" id="dirt-badge" title="Dirt on Screen (Capped at 100g)">
        <span class="dirt-icon">🌱</span>
        <span id="dirt-indicator" class="dirt-text">Dirt: 0.0 / 100g</span>
      </div>
    </div>
    <button id="sound-btn" class="icon-btn" title="Toggle Sound (M)" aria-label="Toggle Sound">
      <span id="sound-icon">🔊</span>
    </button>
  </header>

  <!-- Bottom Left Robot Storage Progress Bar (Grey for Dust, Brown for Dirt) -->
  <aside class="robot-storage-sidebar">
    <div id="robot-storage-card" class="storage-card">
      <div class="storage-title">ROBOT</div>
      
      <div class="storage-bar-outer">
        <div class="storage-bar-track">
          <div id="robot-storage-fill-dust" class="storage-fill robot-fill-dust"></div>
          <div id="robot-storage-fill-dirt" class="storage-fill robot-fill-dirt"></div>
        </div>
      </div>

      <div class="storage-footer">
        <span id="robot-storage-value" class="storage-text">0.00 / 0.50g</span>
        <div class="storage-breakdown">
          <span class="mini-tag dust-tag"><span class="dot grey-dot"></span><span id="robot-dust-text">0.00g</span></span>
          <span class="mini-tag dirt-tag"><span class="dot brown-dot"></span><span id="robot-dirt-text">0.00g</span></span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Center Right Separate Storage Indicators: Dust & Dirt -->
  <aside class="storage-center-right" id="storage-indicator-container">
    <!-- Dust Storage Card -->
    <div class="storage-card-indicator dust-storage-card" id="storage-dust-card" title="Stored Dust (Infinite)">
      <div class="storage-indicator-label"><span class="dot grey-dot"></span>DUST</div>
      <div class="storage-indicator-val-row">
        <span id="storage-dust-value" class="storage-value-text">0.0g</span>
      </div>
    </div>

    <!-- Dirt Storage Card -->
    <div class="storage-card-indicator dirt-storage-card" id="storage-dirt-card" title="Stored Dirt (Infinite)">
      <div class="storage-indicator-label"><span class="dot brown-dot"></span>DIRT</div>
      <div class="storage-indicator-val-row">
        <span id="storage-dirt-value" class="storage-value-text">0.0g</span>
      </div>
    </div>
  </aside>

  <!-- Bottom Menu Dock: brown squares with light brown outlines and grey circle icon -->
  <nav class="bottom-menu-dock">
    <button id="shop-btn" class="menu-square-btn" title="Open Dust Shop (B)">
      <div class="grey-circle-icon"></div>
      <span class="menu-btn-label">SHOP</span>
    </button>
  </nav>

  <!-- Shop Modal: Brown square card with light brown outlines & white title -->
  <div id="shop-modal" class="shop-modal hidden">
    <div class="shop-card">
      <div class="shop-header">
        <div class="shop-header-title-row">
          <div class="grey-circle-icon small"></div>
          <h2 class="shop-title">DUST SHOP</h2>
        </div>
        <button id="shop-close-btn" class="shop-close-btn" aria-label="Close Shop">&times;</button>
      </div>

      <!-- Dynamically generated & updated upgrades from Values.shops.dustShop -->
      <div class="shop-items" id="shop-items"></div>

      <div class="shop-footer">
        <span class="shop-wallet">Stored Mass: <strong id="shop-stored-dust">0.0g</strong></span>
      </div>
    </div>
  </div>

  <!-- Instruction Hint -->
  <div id="hint-overlay" class="hint-overlay">
    <div class="hint-content">
      <div class="mouse-icon">🖱️</div>
      <span>Hold <strong>Left Click</strong> to vacuum towards your cursor!</span>
    </div>
  </div>

  <!-- Milestone Celebration Toast -->
  <div id="toast" class="toast hidden">
    <span id="toast-text">✨ 25% Cleaned! Great job!</span>
  </div>

  <script src="values.js"></script>
  <script src="sound.js"></script>
  <script src="game.js"></script>
</body>
</html>
